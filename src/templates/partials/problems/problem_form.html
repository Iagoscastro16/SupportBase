<form hx-post="/ui/problems/create" hx-target="this" hx-swap="outerHTML"
      class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-4">

    <div>
        <label class="block text-sm text-gray-400 mb-1">Título</label>
        <input type="text" name="title" required
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white">
    </div>

    <div>
        <label class="block text-sm text-gray-400 mb-1">Descrição</label>
        <textarea name="description" required rows="3"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white"></textarea>
    </div>

    <div>
        <label class="block text-sm text-gray-400 mb-1">Solução (opcional)</label>
        <textarea name="solution" rows="3"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white"></textarea>
    </div>

    <button type="submit"
            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors">
        Criar Problema
    </button>
</form>
