<ul class="space-y-3">
    {% for problema in problemas %}
    <li class="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
        <div @click="aberto = (aberto === {{ problema['id'] }} ? null : {{ problema['id'] }})"
             hx-get="/ui/problems/{{ problema['id'] }}"
             hx-target="next .detalhe-inline"
             hx-swap="innerHTML"
             class="p-4 cursor-pointer hover:bg-gray-800 transition-colors">

            <span id="categorias-{{ problema['id'] }}" class="text-xs text-gray-500">
                {{ problema['categorias'] if problema['categorias'] else '' }}
            </span>

            <p class="text-white font-medium mt-1">{{ problema['title'] }}</p>
        </div>

        <div x-show="aberto === {{ problema['id'] }}" x-cloak
             class="detalhe-inline border-t border-gray-800 p-4">
        </div>
    </li>
    {% endfor %}
</ul>
