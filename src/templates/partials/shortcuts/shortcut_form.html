<form hx-post="/ui/shortcuts/create" hx-target="this" hx-swap="outerHTML"
      class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-4">

    <div>
        <label class="block text-sm text-gray-400 mb-1">Chave do Atalho</label>
        <input type="text" name="short_cut_key" required
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white font-mono">
    </div>

    <div>
        <label class="block text-sm text-gray-400 mb-1">Frase</label>
        <textarea name="phrase" required rows="3"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white"></textarea>
    </div>

    <div>
        <label class="block text-sm text-gray-400 mb-1">Posição (1-9, opcional)</label>
        <input type="number" name="position" min="1" max="9"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white">
    </div>

    <button type="submit"
            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors">
        Criar Atalho
    </button>
</form>
