<form hx-post="/ui/categories/create" hx-target="this" hx-swap="outerHTML"
      class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-4">

    <div>
        <label class="block text-sm text-gray-400 mb-1">Nome</label>
        <input type="text" name="name" required
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white">
    </div>

    <button type="submit"
            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors">
        Criar Categoria
    </button>
</form>
