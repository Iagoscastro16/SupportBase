<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atalhos</title>
</head>
<body>
    <div id="lista-atalhos">
        <ul>
            {% for atalho in atalhos %}
            <li hx-get="/ui/shortcuts/{{  atalho['id']  }}"
                hx-target="#detalhe-atalho"
                hx-swap="innerHTML">
                {{ atalho['short_cut_key'] }}
            </li>
            {% endfor %}
        </ul>
    </div>
    <div id="detalhe-atalho">

    </div>
    <script src="/static/htmx.min.js"></script>
</body>
</html>
