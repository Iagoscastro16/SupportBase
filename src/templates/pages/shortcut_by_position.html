{% extends "base.html" %}
{% block title %}Atalhos{% endblock %}
{% block content %}
<div id="lista-atalhos">
    <ul>
        {% for atalho in atalhos %}
        <li hx-get="/ui/shortcuts/{{  atalho['id']  }}"
            hx-target="#detalhe-atalho"
            hx-swap="innerHTML">
            {{ atalho['short_cut_key'] }}
        </li>
        {% endfor %}
    </ul>
</div>
<div id="detalhe-atalho">
</div>
{% endblock %}
