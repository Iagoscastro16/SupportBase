{% extends "base.html" %}
{% block title %}Problemas{% endblock %}
{% block content %}
    <div class="max-w-3xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-white mb-1">Todos os Problemas</h1>
        <p class="text-gray-400 mb-6">Navegue pela base de conhecimento completa</p>

        <div class="flex gap-2 mb-4">
            <input type="text"
                hx-get="/ui/problems/search"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#lista-problemas"
                name="query"
                placeholder="Filtrar problemas..."
                class="flex-1 bg-gray-900 border border-gray-800 rounded-lg px-4 py-2 text-white placeholder-gray-500">

            <div x-data="{ showModal: false }">
                <button @click.stop="showModal = true"
                    hx-get="/ui/problems/new/form"
                    hx-target="#form-criar-problema"
                    hx-swap="innerHTML"
                    class="flex items-center justify-center bg-blue-500 hover:bg-blue-600 text-white w-10 h-10 rounded-lg transition-colors text-xl">
                    +
                </button>

                <div x-show="showModal" x-cloak
                     class="fixed inset-0 z-30 flex items-center justify-center bg-black bg-opacity-50">
                    <div @click.outside="showModal = false"
                         @keydown.escape.window="showModal = false"
                         @htmx:after-request="if ($event.detail.successful) showModal = false"
                         id="form-criar-problema"
                         class="bg-gray-900 border border-gray-800 rounded-lg p-6 max-w-2xl w-full mx-4">
                    </div>
                </div>
            </div>
        </div>

        <div x-data="{ aberto: null }">
            <div id="lista-problemas">
                {% include "partials/problems/search_problem.html" %}
            </div>
        </div>

    </div>
{% endblock %}
