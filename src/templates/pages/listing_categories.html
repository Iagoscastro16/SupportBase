{% extends "base.html" %}
{% block title %}Categorias{% endblock %}
{% block content %}
<div id="lista-categorias">
    <ul>
        {% for categoria in categorias %}
        <li hx-get="/ui/categories/{{categoria['id']}}"
        hx-target="#detalhe-categoria"
        hx-swap="innerHTML">
            {{ categoria['name'] }}
        </li>
        {% endfor %}
    </ul>
</div>
<div id="detalhe-categoria">        
</div>
{% endblock %}
