{% extends "base.html" %}
{% block title %}Problemas{% endblock %}
{% block content %}
    <div id="lista-problemas">
        <ul>
            {% for problema in problemas %}
            <li hx-get="/ui/problems/{{ problema['id'] }}" hx-target="#detalhe-problema" hx-swap="innerHTML">
                {{ problema['title'] }}
            </li>
            {% endfor %}
        </ul>
    </div>
    <div id="detalhe-problema">
    </div>
    {% endblock %}
