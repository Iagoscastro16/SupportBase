<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{% block title %}SupportBase {% endblock %}</title>
</head>
<body class="bg-gray-950 min-h-screen">
    <nav class="border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2 text-white font-bold">
            📖 <span>KB</span>
        </div>
        <div class="flex gap-2">
            <a href="/ui/problems"
               class="px-3 py-2 rounded-lg text-sm {% if pagina_ativa == 'problems' %}bg-gray-800 text-white{% else %}text-gray-400 hover:text-white{% endif %}">
                📋 Problems
            </a>
            <a href="/ui/shortcuts"
               class="px-3 py-2 rounded-lg text-sm {% if pagina_ativa == 'shortcuts' %}bg-gray-800 text-white{% else %}text-gray-400 hover:text-white{% endif %}">
                ⚡ Shortcuts
            </a>
            <a href="/ui/categories"
               class="px-3 py-2 rounded-lg text-sm {% if pagina_ativa == 'categories' %}bg-gray-800 text-white{% else %}text-gray-400 hover:text-white{% endif %}">
                🏷️ Categories
            </a>
        </div>
    </nav>

    {% block content %}{% endblock %}
    <script src="/static/htmx.min.js"></script>
</body>
</html>
